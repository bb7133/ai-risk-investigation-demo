<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CLAIMS · Case List</title>
  <meta name="viewport" content="width=1440" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens-light.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: var(--bg-0); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="case-list.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    function App() {
      const open = (c) => {
        // Sarah Chen's case (CASE-2461) goes to the prebuilt detail screen.
        // Other cases would go to the same screen with a different case id.
        if (c.id === 'CASE-2461') {
          window.location.href = 'Case Detail.html';
        } else {
          window.location.href = 'Case Detail.html?case=' + encodeURIComponent(c.id);
        }
      };
      return <CaseList onOpen={open} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
